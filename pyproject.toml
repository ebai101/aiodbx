[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiodbx"
version = "0.2.0a1"
description = "An asyncio-native Dropbox API v2 client."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ebai101" }]
dependencies = ["aiohttp>=3.10,<4", "anyio>=4.0,<5"]

[project.urls]
Homepage = "https://github.com/ebai101/aiodbx"
Repository = "https://github.com/ebai101/aiodbx"
Issues = "https://github.com/ebai101/aiodbx/issues"

[dependency-groups]
dev = [
  "coverage>=7.16.0",
  "pytest>=8",
  "pytest-aiohttp>=1.1.1",
  "pytest-asyncio>=0.24",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.6",
  "ty>=0.0.78",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: calls the real Dropbox API. requires AIODBX_TEST_ACCESS_TOKEN",
  "live_write: creates and deletes state in the Dropbox test app folder",
]
addopts = ["--cov", "--cov-fail-under=80"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["aiodbx"]

[tool.ty.environment]
python-version = "3.11"

[tool.coverage.run]
branch = true
source_pkgs = ["aiodbx"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_also = [
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError",
]
